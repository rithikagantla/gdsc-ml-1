# OWNER: Daniel · WEEK 6
# Every PR: lint + unit tests. TODO(week 6): add the benchmark job that fails if precision or
# recall drops below results/baseline.json (Arnav provides the compare script).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

